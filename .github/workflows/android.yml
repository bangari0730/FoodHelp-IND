name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/java/com/foodhelp/ind/ui/theme

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "FoodHelpIND"
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. App build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.foodhelp.ind'
            compileSdkVersion 33

            defaultConfig {
                applicationId "com.foodhelp.ind"
                minSdkVersion 24
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }

            buildFeatures {
                compose true
            }

            composeOptions {
                kotlinCompilerExtensionVersion '1.4.3'
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
            implementation 'androidx.activity:activity-compose:1.7.2'
            implementation platform('androidx.compose:compose-bom:2023.03.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.navigation:navigation-compose:2.6.0'
            implementation 'com.google.maps.android:maps-compose:2.11.4'
            implementation 'com.google.android.gms:play-services-maps:18.1.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

            <application
                android:allowBackup="true"
                android:label="FoodHelp IND"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <meta-data
                    android:name="com.google.android.geo.API_KEY"
                    android:value="YOUR_MAPS_API_KEY" />
            </application>
        </manifest>
        EOF

        # 5. Theme.kt
        cat << 'EOF' > app/src/main/java/com/foodhelp/ind/ui/theme/Theme.kt
        package com.foodhelp.ind.ui.theme

        import androidx.compose.material3.MaterialTheme
        import androidx.compose.material3.lightColorScheme
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.graphics.Color

        val EmeraldGreen = Color(0xFF047857)
        val EmeraldLight = Color(0xFFA7F3D0)
        val PureWhite = Color(0xFFFFFFFF)
        val DarkText = Color(0xFF111827)

        private val LightColorScheme = lightColorScheme(
            primary = EmeraldGreen,
            onPrimary = PureWhite,
            secondary = EmeraldLight,
            background = PureWhite,
            surface = PureWhite,
            onBackground = DarkText,
            onSurface = DarkText
        )

        @Composable
        fun FoodHelpINDTheme(content: @Composable () -> Unit) {
            MaterialTheme(
                colorScheme = LightColorScheme,
                content = content
            )
        }
        EOF

        # 6. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/foodhelp/ind/MainActivity.kt
        package com.foodhelp.ind

        import android.os.Bundle
        import android.util.Patterns
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.input.PasswordVisualTransformation
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.navigation.compose.NavHost
        import androidx.navigation.compose.composable
        import androidx.navigation.compose.rememberNavController
        import com.foodhelp.ind.ui.theme.EmeraldGreen
        import com.foodhelp.ind.ui.theme.FoodHelpINDTheme
        import com.google.android.gms.maps.model.CameraPosition
        import com.google.android.gms.maps.model.LatLng
        import com.google.maps.android.compose.*

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    FoodHelpINDTheme {
                        AppNavigation()
                    }
                }
            }
        }

        @Composable
        fun AppNavigation() {
            val navController = rememberNavController()
            NavHost(navController = navController, startDestination = "welcome") {
                composable("welcome") { WelcomeScreen { navController.navigate("entry") } }
                composable("entry") { EntryScreen { isLogin -> navController.navigate("auth/$isLogin") } }
                composable("auth/{isLogin}") { backStack ->
                    val isLogin = backStack.arguments?.getString("isLogin")?.toBoolean() ?: true
                    AuthScreen(isLogin = isLogin) { navController.navigate("role_select") }
                }
                composable("role_select") {
                    RoleSelectScreen(
                        onDonorSelected = { navController.navigate("donor") },
                        onSeekerSelected = { navController.navigate("seeker") }
                    )
                }
                composable("donor") { DonorScreen() }
                composable("seeker") { SeekerScreen() }
            }
        }

        @Composable
        fun WelcomeScreen(onNext: () -> Unit) {
            Column(
                modifier = Modifier.fillMaxSize().background(Color.White).padding(24.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
                verticalArrangement = Arrangement.SpaceBetween
            ) {
                Spacer(modifier = Modifier.height(40.dp))
                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text("FoodHelp IND", fontSize = 32.sp, fontWeight = FontWeight.Bold, color = EmeraldGreen)
                    Spacer(modifier = Modifier.width(8.dp))
                    Text("🇮🇳", fontSize = 28.sp)
                }
                Card(
                    modifier = Modifier.fillMaxWidth().height(200.dp),
                    colors = CardDefaults.cardColors(containerColor = EmeraldGreen.copy(alpha = 0.1f))
                ) {
                    Box(contentAlignment = Alignment.Center, modifier = Modifier.fillMaxSize()) {
                        Text("🍲 Community Food Relief", color = EmeraldGreen, fontWeight = FontWeight.SemiBold)
                    }
                }
                Text("\"No one has ever become poor by giving.\"", fontSize = 18.sp, fontWeight = FontWeight.Medium, color = Color.Gray)
                Button(onClick = onNext, modifier = Modifier.fillMaxWidth().height(56.dp), colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) {
                    Text("Get Started", fontSize = 18.sp)
                }
            }
        }

        @Composable
        fun EntryScreen(onChoice: (Boolean) -> Unit) {
            var selectedCategory by remember { mutableStateOf("Individual") }
            Column(modifier = Modifier.fillMaxSize().padding(24.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                Text("Registering as:", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                Spacer(modifier = Modifier.height(16.dp))
                Row(horizontalArrangement = Arrangement.SpaceEvenly, modifier = Modifier.fillMaxWidth()) {
                    FilterChip(selected = selectedCategory == "Individual", onClick = { selectedCategory = "Individual" }, label = { Text("Individual") })
                    FilterChip(selected = selectedCategory == "Organization", onClick = { selectedCategory = "Organization" }, label = { Text("Organization") })
                }
                Spacer(modifier = Modifier.height(40.dp))
                Button(onClick = { onChoice(true) }, modifier = Modifier.fillMaxWidth().height(50.dp), colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) { Text("Login") }
                Spacer(modifier = Modifier.height(16.dp))
                OutlinedButton(onClick = { onChoice(false) }, modifier = Modifier.fillMaxWidth().height(50.dp)) { Text("Sign Up", color = EmeraldGreen) }
            }
        }

        @Composable
        fun AuthScreen(isLogin: Boolean, onSuccess: () -> Unit) {
            val context = LocalContext.current
            var username by remember { mutableStateOf("") }
            var phone by remember { mutableStateOf("") }
            var email by remember { mutableStateOf("") }
            var password by remember { mutableStateOf("") }
            Column(modifier = Modifier.fillMaxSize().padding(24.dp), verticalArrangement = Arrangement.Center) {
                Text(if (isLogin) "Login" else "Sign Up", fontSize = 28.sp, fontWeight = FontWeight.Bold, color = EmeraldGreen)
                Spacer(modifier = Modifier.height(20.dp))
                OutlinedTextField(value = username, onValueChange = { username = it }, label = { Text("Username") }, modifier = Modifier.fillMaxWidth())
                if (!isLogin) {
                    Spacer(modifier = Modifier.height(12.dp))
                    OutlinedTextField(value = phone, onValueChange = { phone = it }, label = { Text("Phone Number") }, modifier = Modifier.fillMaxWidth())
                    Spacer(modifier = Modifier.height(12.dp))
                    OutlinedTextField(value = email, onValueChange = { email = it }, label = { Text("Email Address") }, modifier = Modifier.fillMaxWidth())
                }
                Spacer(modifier = Modifier.height(12.dp))
                OutlinedTextField(value = password, onValueChange = { password = it }, label = { Text("Password") }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth())
                Spacer(modifier = Modifier.height(24.dp))
                Button(
                    onClick = {
                        if (!isLogin && !Patterns.EMAIL_ADDRESS.matcher(email).matches()) {
                            Toast.makeText(context, "Invalid Email Format!", Toast.LENGTH_SHORT).show()
                        } else {
                            onSuccess()
                        }
                    },
                    modifier = Modifier.fillMaxWidth().height(50.dp),
                    colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)
                ) { Text(if (isLogin) "Submit Login" else "Complete Sign Up") }
            }
        }

        @Composable
        fun RoleSelectScreen(onDonorSelected: () -> Unit, onSeekerSelected: () -> Unit) {
            Column(modifier = Modifier.fillMaxSize().padding(24.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                Text("How would you like to proceed?", fontSize = 22.sp, fontWeight = FontWeight.Bold)
                Spacer(modifier = Modifier.height(32.dp))
                Button(onClick = onDonorSelected, modifier = Modifier.fillMaxWidth().height(60.dp), colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) { Text("I'm a Donor", fontSize = 18.sp) }
                Spacer(modifier = Modifier.height(16.dp))
                Button(onClick = onSeekerSelected, modifier = Modifier.fillMaxWidth().height(60.dp), colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) { Text("I'm in Need", fontSize = 18.sp) }
            }
        }

        @Composable
        fun DonorScreen() {
            var dishName by remember { mutableStateOf("") }
            var portions by remember { mutableStateOf("") }
            var radius by remember { mutableStateOf(5f) }
            val defaultLocation = LatLng(20.5937, 78.9629)
            val cameraState = rememberCameraPositionState { position = CameraPosition.fromLatLngZoom(defaultLocation, 10f) }
            Column(modifier = Modifier.fillMaxSize()) {
                Box(modifier = Modifier.fillMaxWidth().fillMaxHeight(0.25f)) {
                    GoogleMap(modifier = Modifier.fillMaxSize(), cameraPositionState = cameraState) {
                        Marker(state = MarkerState(position = defaultLocation), title = "My Location")
                    }
                }
                Column(modifier = Modifier.padding(16.dp)) {
                    OutlinedTextField(value = dishName, onValueChange = { dishName = it }, label = { Text("Dish Name") }, modifier = Modifier.fillMaxWidth())
                    Spacer(modifier = Modifier.height(8.dp))
                    OutlinedTextField(value = portions, onValueChange = { portions = it }, label = { Text("Portions Available") }, modifier = Modifier.fillMaxWidth())
                    Spacer(modifier = Modifier.height(16.dp))
                    Text("Visibility Radius: ${radius.toInt()} km")
                    Slider(value = radius, onValueChange = { radius = it }, valueRange = 1f..50f)
                    Spacer(modifier = Modifier.height(16.dp))
                    Button(onClick = {}, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) { Text("Post Donation") }
                }
            }
        }

        @Composable
        fun SeekerScreen() {
            var radius by remember { mutableStateOf(10f) }
            val defaultLocation = LatLng(20.5937, 78.9629)
            val cameraState = rememberCameraPositionState { position = CameraPosition.fromLatLngZoom(defaultLocation, 10f) }
            Column(modifier = Modifier.fillMaxSize()) {
                Box(modifier = Modifier.fillMaxWidth().fillMaxHeight(0.35f)) {
                    GoogleMap(modifier = Modifier.fillMaxSize(), cameraPositionState = cameraState) {
                        Marker(state = MarkerState(position = defaultLocation), title = "User")
                    }
                }
                Column(modifier = Modifier.padding(16.dp)) {
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                        Button(onClick = {}, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) { Text("Find My Location") }
                        Text("Radius: ${radius.toInt()} km", fontSize = 16.sp)
                    }
                    Slider(value = radius, onValueChange = { radius = it }, valueRange = 1f..50f)
                    Spacer(modifier = Modifier.height(8.dp))
                    Text("Available Food Nearby:", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                    LazyColumn {
                        items(3) { index ->
                            Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFFF3F4F6))) {
                                Column(modifier = Modifier.padding(12.dp)) {
                                    Text("Rice & Curry Pack #${index + 1}", fontWeight = FontWeight.Bold)
                                    Text("Portions: ${(index + 1) * 5} | Distance: ${(index + 1) * 1.5} km")
                                }
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FoodHelp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
